name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Rust — format, lint, tests, and the coverage gate.
  # Coverage is measured on `studdup-core` only (the pure, UI-free core), the
  # direct analog of the retired C++ `BUILD_APP=OFF` lcov gate: the meaningful
  # scheduling/date/repository logic lives there and links without Tauri.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust — fmt, clippy, tests, coverage (studdup-core ≥ 70%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 Linux prerequisites — needed so the `studdup` app crate compiles
      # during the workspace clippy/test steps.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Coverage — studdup-core, fail under 70% lines
        run: cargo llvm-cov -p studdup-core --fail-under-lines 70

  # ---------------------------------------------------------------------------
  # UI — type-check, production build, and Vitest suite.
  # ---------------------------------------------------------------------------
  ui:
    name: UI — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
