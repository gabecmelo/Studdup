name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Core — format, lint, tests and the coverage gate on `studdup-core` only.
  # This is the pure, UI-free core (scheduling/date/repository/api) and links
  # without Tauri, so this job needs no Node, no WebKit and no `ui/dist`. It is
  # the fast-feedback gate — the direct analog of the retired C++ `BUILD_APP=OFF`
  # lcov gate — and it runs independently of the heavier app-build job below.
  # ---------------------------------------------------------------------------
  core:
    name: Core — fmt, clippy, tests, coverage (studdup-core ≥ 70%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # `cargo fmt --all` covers every Rust crate in the workspace (studdup-core
      # AND the studdup app crate) without compiling anything, so it stays here
      # in the fast job even though the app itself is built in `app` below.
      - name: Format check (whole workspace)
        run: cargo fmt --all -- --check

      - name: Clippy — studdup-core (deny warnings)
        run: cargo clippy -p studdup-core --all-targets -- -D warnings

      - name: Tests — studdup-core (unit + integration)
        run: cargo test -p studdup-core

      - name: Coverage — studdup-core, fail under 70% lines
        run: cargo llvm-cov -p studdup-core --fail-under-lines 70

  # ---------------------------------------------------------------------------
  # App — the Tauri bridge crate. It embeds the frontend from `../ui/dist` at
  # compile time (tauri-build), so the UI must be built first, and it needs the
  # Tauri Linux system dependencies. This job proves the app crate both lints
  # and, crucially, builds in RELEASE (catching release-only breakage the debug
  # builds miss). `ui/dist` is gitignored, hence built here rather than checked
  # out.
  # ---------------------------------------------------------------------------
  app:
    name: App — clippy + release build (studdup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI (frontend embedded by the tauri app crate)
        run: npm ci && npm run build
        working-directory: ui

      - name: Clippy — studdup app crate (deny warnings)
        run: cargo clippy -p studdup --all-targets -- -D warnings

      - name: Release build — studdup
        run: cargo build --release -p studdup

  # ---------------------------------------------------------------------------
  # UI — type-check, production build, and Vitest suite.
  # ---------------------------------------------------------------------------
  ui:
    name: UI — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
