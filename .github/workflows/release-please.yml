name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # -------------------------------------------------------------------------
  # 1. release-please: manages the Release PR and creates the GitHub release
  #    when the Release PR is merged. The build jobs below run only on that
  #    release-creating push (release_created == true) and attach the Tauri
  #    bundles to the freshly created release.
  # -------------------------------------------------------------------------
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name:        ${{ steps.rp.outputs.tag_name }}
      release_id:      ${{ steps.rp.outputs.id }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  # -------------------------------------------------------------------------
  # 2. Build the Tauri app on each OS and upload its bundles to the release.
  #    The app crate lives in `studdup/` (tauri.conf.json), embeds the React
  #    frontend from `ui/dist`, and its `beforeBuildCommand` builds that UI —
  #    so the UI deps must be installed first. tauri-action installs the Tauri
  #    CLI, runs `tauri build`, and uploads the per-OS bundles (Windows NSIS +
  #    MSI, Linux deb/AppImage/rpm) to the release identified by `release_id`.
  # -------------------------------------------------------------------------
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The Tauri app's beforeBuildCommand runs `npm --prefix ../ui run build`,
      # which needs the UI dependencies present.
      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      - name: Build Tauri app and upload bundles to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The Tauri app crate (holds tauri.conf.json); the frontend it embeds
          # lives in `ui/` and is built by the config's beforeBuildCommand.
          projectPath: studdup
          # Upload to the release release-please just created, instead of
          # creating a new one.
          releaseId: ${{ needs.release-please.outputs.release_id }}
