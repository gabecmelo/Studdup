name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # -------------------------------------------------------------------------
  # 1. release-please: manages the Release PR and creates the GitHub release
  #    when the Release PR is merged. The build jobs below run only on that
  #    release-creating push (release_created == true) and attach the Tauri
  #    bundles to the freshly created release.
  # -------------------------------------------------------------------------
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name:        ${{ steps.rp.outputs.tag_name }}
      release_id:      ${{ steps.relid.outputs.id }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please-action does not expose the created release's numeric id,
      # and tauri-action needs it to upload assets to an existing release — so
      # resolve it from the tag via the GitHub CLI (only when a release was made).
      - name: Resolve release id from tag
        id: relid
        if: steps.rp.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases/tags/${{ steps.rp.outputs.tag_name }}" -q .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # 2. Build the Tauri app on each OS and upload its bundles to the release.
  #    The app crate lives in `studdup/` (tauri.conf.json), embeds the React
  #    frontend from `ui/dist`, and its `beforeBuildCommand` builds that UI —
  #    so the UI deps must be installed first. tauri-action installs the Tauri
  #    CLI, runs `tauri build`, and uploads the bundles to the release
  #    identified by `release_id`.
  #
  #    Bundles are pinned per OS (rather than the config's `targets: all`) to
  #    the reliable formats, so a flaky bundler (e.g. rpm) can't sink the whole
  #    release: Windows NSIS installer, Linux .deb + .AppImage, macOS .dmg.
  # -------------------------------------------------------------------------
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-latest
            args: --bundles deb,appimage
          - platform: macos-latest
            args: --bundles dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Build the embedded frontend here rather than via the Tauri config's
      # beforeBuildCommand: tauri-action runs `tauri build` from the repo root,
      # where the config's `npm --prefix ../ui` resolved one directory too high
      # and failed. Building explicitly is cwd-independent and leaves ui/dist
      # ready for the app crate to embed (frontendDist is resolved relative to
      # tauri.conf.json, so it stays correct).
      - name: Build the UI (embedded by the Tauri app)
        run: |
          npm ci
          npm run build
        working-directory: ui

      - name: Build Tauri app and upload bundles to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The Tauri app crate (holds tauri.conf.json); the frontend it embeds
          # from ui/dist is built by the step above.
          projectPath: studdup
          # Upload to the release release-please just created, instead of
          # creating a new one.
          releaseId: ${{ needs.release-please.outputs.release_id }}
          # Per-OS bundle selection (see the job comment).
          args: ${{ matrix.args }}

  # -------------------------------------------------------------------------
  # 3. Build, sign and upload the Android APK to the same release.
  #    tauri-action's mobile mode is still experimental, so this job drives the
  #    Tauri CLI directly: set up JDK 17 + Android SDK/NDK + the Rust Android
  #    targets, build the embedded UI, (re)generate gen/android, wire the
  #    release keystore from CI secrets, build the APK, and upload it via the gh
  #    CLI to the release resolved by tag (the same tag the desktop job uses).
  #
  #    This is a SEPARATE job from the desktop matrix — both only `needs`
  #    release-please — so an Android-only failure never withholds the desktop
  #    bundles (CI-05). fail-fast:false keeps that guarantee if the matrix later
  #    grows to per-architecture APKs.
  #
  #    Signing (CI-02): the built APK is signed only when gen/android/app/
  #    build.gradle.kts carries the release signingConfigs block that reads
  #    gen/android/keystore.properties (see SETUP.md "Android release signing").
  #    Commit gen/android with that block; the keystore.jks + keystore.properties
  #    written from secrets below feed it. No plaintext key lives in the repo.
  # -------------------------------------------------------------------------
  android:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: --apk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the Android NDK
        # Pin the NDK Tauri builds against; bump alongside the Tauri toolchain.
        run: |
          sdkmanager "ndk;27.0.11902837"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.11902837" >> "$GITHUB_ENV"

      - name: Install the Rust toolchain with the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Same rationale as the desktop job: build the embedded UI explicitly so
      # ui/dist is ready for the app crate to embed (frontendDist is resolved
      # relative to tauri.conf.json).
      - name: Build the UI (embedded by the Tauri app)
        run: |
          npm ci
          npm run build
        working-directory: ui

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # gen/android is regenerated when it isn't committed; a committed
      # gen/android (carrying the signingConfigs block) is used as-is.
      - name: Generate the Android project if it isn't committed
        working-directory: studdup
        run: |
          if [ ! -d gen/android ]; then
            tauri android init
          fi

      # Decode the keystore and point keystore.properties at it (absolute path),
      # matching the signingConfigs block documented in SETUP.md.
      - name: Wire the release keystore from secrets
        working-directory: studdup
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          keystore="$(pwd)/gen/android/keystore.jks"
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$keystore"
          cat > gen/android/keystore.properties <<EOF
          storeFile=$keystore
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build the signed Android APK
        working-directory: studdup
        run: tauri android build ${{ matrix.args }}

      - name: Upload the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(find studdup/gen/android -path '*/release/*.apk' | head -n1)
          echo "Uploading $apk"
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "$apk" --clobber
